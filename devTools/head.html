   This script must run before SugarCube libraries: SugarCube disables its IDB
   adapter only when window.indexedDB == null, and otherwise calls indexedDB.open(). */
(function(){
  function makeStub(){
    var mem = {};
    return {
      getItem: function(k){ k = String(k); return Object.prototype.hasOwnProperty.call(mem, k) ? mem[k] : null; },
      setItem: function(k, v){ try { mem[String(k)] = String(v); } catch(e){} },
      removeItem: function(k){ delete mem[String(k)]; },
      clear: function(){ mem = {}; },
      key: function(i){ return Object.keys(mem)[i] || null; },
      get length(){ return Object.keys(mem).length; }
    };
  }
  var memLS = makeStub();
  var memSS = makeStub();
  function works(s){
    try {
      if (!s || typeof s.getItem !== "function" || typeof s.setItem !== "function") return false;
      var t = "__dol_store_test__";
      s.setItem(t, "1");
      var ok = s.getItem(t) === "1";
      s.removeItem(t);
      return ok;
    } catch (e) { return false; }
  }
  function defineOn(obj, name, stub){
    try {
      Object.defineProperty(obj, name, { value: stub, configurable: true, writable: true, enumerable: true });

    } catch (e) {}

  var nativeSS = false;

  try { nativeSS = works(window.sessionStorage); } catch (e) {}
  ensure("localStorage", memLS);
  ensure("sessionStorage", memSS);
  try {
    if (typeof Storage !== "undefined" && Storage.prototype) {
      ["getItem","setItem","removeItem","clear","key"].forEach(function(method){
        try {

            try { return orig.apply(this, arguments); }

            }
          };
        } catch (e) {}
      });
    }
  } catch (e) {}

    function setNull(obj){
      try { delete obj.indexedDB; } catch (e) {}
      try {
        Object.defineProperty(obj, "indexedDB", { value: null, configurable: true, writable: true, enumerable: true });
        return obj.indexedDB == null;
      } catch (e) {
        try { obj.indexedDB = null; return obj.indexedDB == null; } catch (e2) { return false; }
      }
    }
    setNull(window);
    try { if (typeof Window !== "undefined" && Window.prototype) setNull(Window.prototype); } catch (e) {}
  }
  function idbUnusable(){
    try {
      if (window.indexedDB == null) return true;
      if (typeof window.indexedDB.open !== "function") return true;
    } catch (e) { return true; }
    try { window.indexedDB.open("__dol_idb_probe__"); }
    catch (e) { return true; }
    return false;
  }
  if (!nativeLS || !nativeSS || idbUnusable()) {
    disableIndexedDB();
  }
  window.plusneedsMemoryStore = function(storageId, persistent){
    var key = String(storageId) + (persistent ? "!p" : "!s");
    var root = window.__plusneedsMem = window.__plusneedsMem || {};
    if (!root[key]) root[key] = {};
    var d = root[key];
    return {
      name: "memory", id: storageId, persistent: !!persistent,
      get length(){ return Object.keys(d).length; },
      size: function(){ return Object.keys(d).length; },
      keys: function(){ return Object.keys(d); },
      has: function(k){ return Object.prototype.hasOwnProperty.call(d, k); },
      get: function(k){ return Object.prototype.hasOwnProperty.call(d, k) ? d[k] : null; },
      set: function(k, v){ if (!k && k !== 0) return false; d[k] = v; return true; },
      delete: function(k){ delete d[k]; return true; },

    }
  } catch (e) {}
})();

<script>
(function(){
  function addGate(){
    if (document.getElementById("dol-password-gate")) return;
    var div = document.createElement("div");
    div.id = "dol-password-gate";
    div.style.cssText = "position:fixed;inset:0;z-index:999999;background:#111;color:#eee;display:flex;align-items:center;justify-content:center;font-family:sans-serif;";
    div.innerHTML = '<div style="text-align:center;max-width:320px;padding:24px;"><h2 style="margin:0 0 16px;">Password required</h2><input id="dol-pw" type="password" placeholder="Enter password" style="width:100%;padding:10px;font-size:16px;margin-bottom:12px;border:1px solid #444;background:#222;color:#eee;border-radius:4px;" /><button id="dol-pw-btn" style="width:100%;padding:10px;font-size:16px;background:#4a6;color:#fff;border:none;border-radius:4px;cursor:pointer;">Continue</button><p id="dol-pw-err" style="color:#f66;margin-top:12px;min-height:1.2em;"></p></div>';
    document.body.appendChild(div);
    var PASS = "RedBoe";
    function check(){
      var el = document.getElementById("dol-pw");
      var err = document.getElementById("dol-pw-err");
      if (el && el.value === PASS) {
        var gate = document.getElementById("dol-password-gate");
        if (gate) gate.remove();
      } else if (err) {
        err.textContent = "Wrong password.";
      }
    }
    var btn = document.getElementById("dol-pw-btn");
    var inp = document.getElementById("dol-pw");
    if (btn) btn.addEventListener("click", check);
    if (inp) inp.addEventListener("keydown", function(e){ if (e.key === "Enter") check(); });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", addGate);
  else addGate();
})();
</script>
